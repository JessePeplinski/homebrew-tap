name: Update PortDeck cask

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Exact beta version to publish (for example, 0.1.0-beta.3)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-portdeck-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-26
    steps:
      - name: Check out the tap
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test the updater
        run: node --test scripts/update-portdeck-cask.test.mjs

      - name: Update from the signed PortDeck release
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTDECK_RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/update-portdeck-cask.mjs

      - name: Audit the updated cask
        if: steps.update.outputs.updated == 'true'
        run: brew test-bot --only-tap-syntax

      - name: Commit the cask update
        if: steps.update.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/portdeck@beta.rb
          git diff --cached --check
          git commit -m "Update PortDeck cask to ${VERSION}"
          git push origin HEAD:main
